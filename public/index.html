<!DOCTYPE html>
<html lang="uk">
   <head>
      <meta charset="UTF-8">
      <title> «Список справ» (To-Do List)</title>
      <link rel ="stylesheet"href="style.css">
   </head>
   <body>
      <header>
    <h1>Список справ</h1>

</header>

<main>

        <input 
            type="text" 
            id="taskInput" 
            placeholder="Нова задача..."
        >

        <button type="submit">Додати</button>
    </form>

    <ul id="taskList"></ul>
</main>

<footer>
    <p>Мій To-Do List</p>
</footer>
<script src="script.js"></script
</body>
</html>
